<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotografer | Studio Lavelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2532; --paper:#FBF6F2; --rose:#B76E79; --gold:#C9A66B;
    --sage:#6B8F71; --mute:#8C8389; --line:#E4D9D3; --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .container{max-width:480px; width:100%; padding:24px;}

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:32px;
    box-shadow:0 4px 24px rgba(46,37,50,.08);
  }
  .card .logo{ text-align:center; margin-bottom:24px; }
  .card .logo h1{ font-size:28px; font-style:italic; font-weight:500; }
  .card .logo p{ color:var(--mute); font-size:14px; margin-top:4px; }

  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:12px; color:var(--mute);
    margin-bottom:6px; text-transform:uppercase;
    letter-spacing:.04em; font-weight:600;
  }
  .field input{
    width:100%; padding:10px 14px;
    border:1px solid var(--line); border-radius:6px;
    font-family:'Inter',sans-serif; font-size:14px;
    background:#fff; color:var(--ink); transition:border .2s;
  }
  .field input:focus{
    outline:none; border-color:var(--rose);
    box-shadow:0 0 0 3px rgba(183,110,121,.15);
  }

  .btn-primary{
    width:100%; padding:14px; background:var(--ink); color:#fff;
    border:none; border-radius:6px; font-size:14px; cursor:pointer;
    font-family:'Inter',sans-serif; font-weight:500;
    transition:background .2s; margin-top:8px; position:relative;
  }
  .btn-primary:hover{ background:var(--rose); }
  .btn-primary:disabled{ opacity:0.6; cursor:not-allowed; }

  .btn-loading{ position:relative; pointer-events:none; opacity:0.7; }
  .btn-loading::after{
    content:""; position:absolute; right:16px; top:50%;
    transform:translateY(-50%); width:18px; height:18px;
    border:2px solid #fff; border-top:2px solid transparent;
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

  .btn-secondary{
    width:100%; padding:10px; background:none; color:var(--mute);
    border:none; font-size:13px; cursor:pointer; margin-top:8px;
    font-family:'Inter',sans-serif;
  }
  .btn-secondary:hover{ color:var(--ink); }

  .error-box{
    display:none; color:#B3413E; font-size:13px; margin-top:8px;
    background:#FDE8E8; padding:10px 14px; border-radius:6px;
  }
  .success-box{
    display:none; color:#065F46; font-size:13px; margin-top:8px;
    background:#D1FAE5; padding:10px 14px; border-radius:6px;
  }

  .divider{ border:none; border-top:1px solid var(--line); margin:20px 0; }

  .form-jadwal{ display:none; }
  .form-jadwal.active{ display:block; }

  .row-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .info-fotografer{
    background:var(--paper); border-radius:8px;
    padding:12px 16px; margin-bottom:20px; border:1px solid var(--line);
  }
  .info-fotografer .label{
    font-size:11px; color:var(--mute);
    text-transform:uppercase; letter-spacing:.04em;
  }
  .info-fotografer .value{ font-size:15px; font-weight:500; margin-top:2px; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:12px 24px;
    border-radius:8px; font-size:14px; z-index:100; animation:slideUp .3s;
  }
  @keyframes slideUp{
    from{transform:translate(-50%,20px);opacity:0;}
    to{transform:translate(-50%,0);opacity:1;}
  }

  .table-wrap{
    max-height:250px; overflow-y:auto; margin-top:12px;
    border:1px solid var(--line); border-radius:6px;
  }
  .table-wrap table{ width:100%; border-collapse:collapse; font-size:13px; }
  .table-wrap th{
    background:var(--paper); padding:8px 10px; text-align:left;
    font-weight:600; color:var(--mute); font-size:11px;
    text-transform:uppercase; letter-spacing:.04em;
    position:sticky; top:0; z-index:2; border-bottom:1px solid var(--line);
  }
  .table-wrap td{ padding:8px 10px; border-bottom:1px solid var(--line); }
  .table-wrap tr:last-child td{ border-bottom:none; }

  .badge-vendor{
    display:inline-block; padding:2px 8px; border-radius:12px;
    font-size:10px; font-weight:600; background:#FEF3C7; color:#92400E;
  }
  .badge-studio{
    display:inline-block; padding:2px 8px; border-radius:12px;
    font-size:10px; font-weight:600; background:#D1FAE5; color:#065F46;
  }

  .tab-group{ display:flex; gap:6px; margin-bottom:10px; }
  .tab-btn{
    flex:1; padding:8px 10px; border:1px solid var(--line);
    background:var(--paper); color:var(--mute); font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600; border-radius:6px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--rose); color:#fff; border-color:var(--rose); }

  .wa-link{
    display:inline-block; padding:3px 10px; border-radius:6px;
    background:#D1FAE5; color:#065F46; font-size:11px;
    font-weight:600; text-decoration:none; white-space:nowrap;
  }
  .wa-link:hover{ background:#065F46; color:#fff; }

  .copy-btn{
    padding:3px 10px; border-radius:6px; background:var(--paper);
    border:1px solid var(--line); color:var(--ink); font-size:11px;
    font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .copy-btn:hover{ background:var(--rose); color:#fff; border-color:var(--rose); }

  /* 🔥 TOMBOL KALENDER */
  .calendar-btn{
    display:inline-block; padding:3px 10px; border-radius:6px;
    background:#DBEAFE; color:#1E40AF; font-size:11px;
    font-weight:600; text-decoration:none; white-space:nowrap;
  }
  .calendar-btn:hover{ background:#1E40AF; color:#fff; }

  .no-data{ text-align:center; color:var(--mute); padding:16px; font-size:13px; }
</style>
</head>
<body>

<div class="container">

  <!-- LOGIN CARD -->
  <div class="card" id="loginCard">
    <div class="logo">
      <h1>Studio Lavelle</h1>
      <p>Fotografer Login</p>
    </div>

    <div class="field">
      <label>👤 Nama</label>
      <input type="text" id="loginNama" placeholder="Masukkan nama kamu" autocomplete="off">
    </div>
    <div class="field">
      <label>🔑 PIN</label>
      <input type="password" id="loginPin" placeholder="Masukkan PIN" maxlength="4" inputmode="numeric" autocomplete="off">
    </div>

    <button class="btn-primary" id="btnLogin" onclick="handleLogin()">Login</button>
    <div class="error-box" id="loginError"></div>
  </div>

  <!-- UBAH PASSWORD CARD (first login / settings) -->
  <div class="card" id="passwordCard" style="display:none; max-width:480px;">
    <div class="logo">
      <h1 id="passwordTitle">Ubah Password</h1>
      <p id="passwordSubtitle">Silakan buat password baru</p>
    </div>

    <div class="info-fotografer" id="firstLoginInfo" style="display:none;">
      <div class="label">🔐 Login Pertama</div>
      <div class="value" style="font-size:13px; font-weight:400;">
        Demi keamanan, kamu wajib mengubah password sebelum melanjutkan.
      </div>
    </div>

    <div class="field">
      <label>🔒 Password Lama</label>
      <input type="password" id="oldPassword" placeholder="Password lama" autocomplete="off">
    </div>
    <div class="field">
      <label>🔑 Password Baru</label>
      <input type="password" id="newPassword" placeholder="Minimal 6 karakter" autocomplete="off">
    </div>
    <div class="field">
      <label>🔑 Konfirmasi Password Baru</label>
      <input type="password" id="confirmPassword" placeholder="Ulangi password baru" autocomplete="off">
    </div>

    <button class="btn-primary" id="btnSavePassword" onclick="handleSavePassword()">
      💾 Simpan Password
    </button>
    <button class="btn-secondary" id="btnCancelPassword" onclick="handleCancelPassword()" style="display:none;">
      ← Batal
    </button>
    <div class="error-box" id="passwordError"></div>
    <div class="success-box" id="passwordSuccess"></div>
  </div>

  <!-- JADWAL CARD -->
  <div class="card" id="jadwalCard" style="display:none; max-width:700px;">
    <div class="logo">
      <h1>Fotografer Panel</h1>
      <p id="fotograferInfo">👋 Halo, <strong id="namaFotografer">-</strong></p>
    </div>

    <div class="info-fotografer">
      <div class="label">📍 Kota</div>
      <div class="value" id="kotaFotografer">-</div>
    </div>

    <hr class="divider">

    <!-- FORM JADWAL VENDOR LAIN -->
    <div class="form-jadwal active">
      <p style="font-size:13px; color:var(--mute); margin-bottom:16px;">
        📅 Input jadwal untuk <strong>job dari vendor lain</strong>
      </p>

      <div class="field">
        <label>📅 Tanggal</label>
        <input type="date" id="inputTanggal">
      </div>

      <div class="row-2">
        <div class="field">
          <label>⏰ Jam Mulai</label>
          <input type="time" id="inputJamMulai">
        </div>
        <div class="field">
          <label>⏰ Jam Selesai</label>
          <input type="time" id="inputJamSelesai">
        </div>
      </div>

      <button class="btn-primary" id="btnSimpan" onclick="simpanJadwal()">💾 Simpan Jadwal</button>
      <div class="error-box" id="formError"></div>
      <div class="success-box" id="formSuccess"></div>
    </div>

    <hr class="divider">

    <div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:13px; font-weight:600;">📋 Jadwalku</span>
        <button class="btn-secondary" style="width:auto; padding:4px 12px; margin:0;" onclick="loadJadwal()">🔄 Refresh</button>
      </div>
      <div class="tab-group">
        <button class="tab-btn active" id="tabLavelleBtn" onclick="gantiTabJadwal('lavelle')">Jadwal Lavelle</button>
        <button class="tab-btn" id="tabVendorBtn" onclick="gantiTabJadwal('vendor')">Jadwal Vendor Lain</button>
      </div>
      <div style="display:flex; justify-content:flex-end; margin-bottom:6px;">
        <button class="copy-btn" onclick="copySemuaJadwalLavelle()">📋 Copy Semua Jadwal</button>
      </div>
      <div class="table-wrap" id="tableJadwalLavelle">
        <div class="no-data">Memuat jadwal...</div>
      </div>
      <div class="table-wrap" id="tableJadwal" style="display:none;">
        <div class="no-data">Memuat jadwal...</div>
      </div>
    </div>

    <hr class="divider">

    <button class="btn-secondary" onclick="openPasswordSettings()">
      ⚙️ Pengaturan — Ubah Password
    </button>
    <button class="btn-secondary" onclick="handleLogout()">🚪 Logout</button>
  </div>

</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  'use strict';

  var supabase = null;
  var supabaseReady = false;
  var currentFotografer = null;
  var isFirstLoginMode = false;
  var lastJadwalLavelle = [];

  try {
    supabase = window.supabase.createClient(
      window.LAVELLE_CONFIG.SUPABASE_URL,
      window.LAVELLE_CONFIG.SUPABASE_KEY
    );
    supabaseReady = true;
    console.log('✅ Supabase siap.');
  } catch (err) {
    console.error('❌ Supabase gagal:', err);
  }

  // ---------- TOAST ----------
  function showToast(message, duration) {
    duration = duration || 3000;
    var existing = document.querySelector('.toast');
    if (existing) existing.remove();
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = message;
    document.body.appendChild(toast);
    setTimeout(function () { toast.remove(); }, duration);
  }

  // ---------- SHOW PANEL ----------
  function showJadwalPanel(data) {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('passwordCard').style.display = 'none';
    document.getElementById('jadwalCard').style.display = 'block';

    document.getElementById('namaFotografer').textContent = data.nama || '-';
    document.getElementById('kotaFotografer').textContent = data.kota || '-';

    var today = new Date().toISOString().split('T')[0];
    document.getElementById('inputTanggal').value = today;

    loadJadwal();
  }

  // ---------- LOGIN ----------
  function handleLogin() {
    var nama = document.getElementById('loginNama').value.trim();
    var pin  = document.getElementById('loginPin').value.trim();
    var errBox = document.getElementById('loginError');
    var btn = document.getElementById('btnLogin');

    errBox.style.display = 'none';

    if (!nama || !pin) {
      errBox.textContent = 'Nama dan PIN wajib diisi.';
      errBox.style.display = 'block';
      return;
    }
    if (!supabaseReady) {
      errBox.textContent = 'Sistem belum siap. Refresh halaman.';
      errBox.style.display = 'block';
      return;
    }

    btn.classList.add('btn-loading');
    btn.disabled = true;

    supabase
      .from('fotografer')
      .select('*')
      .eq('nama', nama)
      .eq('pin', pin)
      .maybeSingle()
      .then(function (res) {
        btn.classList.remove('btn-loading');
        btn.disabled = false;

        if (res.error) {
          errBox.textContent = 'Error: ' + res.error.message;
          errBox.style.display = 'block';
          return;
        }
        if (!res.data) {
          errBox.textContent = 'Nama atau PIN salah.';
          errBox.style.display = 'block';
          return;
        }

        currentFotografer = res.data;
        localStorage.setItem('fotografer', JSON.stringify(res.data));

        // Cek apakah wajib ganti password
        if (res.data.must_change_password === true) {
          isFirstLoginMode = true;
          document.getElementById('loginCard').style.display = 'none';
          document.getElementById('passwordCard').style.display = 'block';
          document.getElementById('passwordTitle').textContent = 'Selamat Datang!';
          document.getElementById('passwordSubtitle').textContent =
            'Halo ' + res.data.nama + ', buat password baru kamu.';
          document.getElementById('firstLoginInfo').style.display = 'block';
          document.getElementById('btnCancelPassword').style.display = 'none';
          document.getElementById('oldPassword').value = pin;
          return;
        }

        showJadwalPanel(res.data);
      })
      .catch(function (err) {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
        errBox.textContent = 'Gagal terhubung: ' + err.message;
        errBox.style.display = 'block';
      });
  }

  // ---------- SIMPAN PASSWORD ----------
  function handleSavePassword() {
    var oldPwd = document.getElementById('oldPassword').value.trim();
    var newPwd = document.getElementById('newPassword').value.trim();
    var confirmPwd = document.getElementById('confirmPassword').value.trim();
    var errBox = document.getElementById('passwordError');
    var okBox = document.getElementById('passwordSuccess');
    var btn = document.getElementById('btnSavePassword');

    errBox.style.display = 'none';
    okBox.style.display = 'none';

    if (!newPwd || !confirmPwd) {
      errBox.textContent = 'Password baru wajib diisi.';
      errBox.style.display = 'block';
      return;
    }
    if (newPwd.length < 6) {
      errBox.textContent = 'Password minimal 6 karakter.';
      errBox.style.display = 'block';
      return;
    }
    if (newPwd !== confirmPwd) {
      errBox.textContent = 'Konfirmasi password tidak cocok.';
      errBox.style.display = 'block';
      return;
    }
    if (!isFirstLoginMode && oldPwd !== currentFotografer.pin) {
      errBox.textContent = 'Password lama salah.';
      errBox.style.display = 'block';
      return;
    }

    btn.classList.add('btn-loading');
    btn.disabled = true;

    supabase
      .from('fotografer')
      .update({
        pin: newPwd,
        must_change_password: false
      })
      .eq('fotografer_id', currentFotografer.fotografer_id)
      .then(function (res) {
        btn.classList.remove('btn-loading');
        btn.disabled = false;

        if (res.error) {
          errBox.textContent = 'Gagal simpan: ' + res.error.message;
          errBox.style.display = 'block';
          return;
        }

        currentFotografer.pin = newPwd;
        currentFotografer.must_change_password = false;
        localStorage.setItem('fotografer', JSON.stringify(currentFotografer));

        okBox.textContent = '✅ Password berhasil diubah!';
        okBox.style.display = 'block';

        document.getElementById('oldPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';

        setTimeout(function () {
          if (isFirstLoginMode) {
            isFirstLoginMode = false;
            showJadwalPanel(currentFotografer);
          } else {
            document.getElementById('passwordCard').style.display = 'none';
            document.getElementById('jadwalCard').style.display = 'block';
          }
        }, 1000);
      });
  }

  // ---------- OPEN PASSWORD SETTINGS ----------
  function openPasswordSettings() {
    if (!currentFotografer) return;
    isFirstLoginMode = false;
    document.getElementById('passwordTitle').textContent = 'Ubah Password';
    document.getElementById('passwordSubtitle').textContent =
      'Masukkan password lama dan password baru.';
    document.getElementById('firstLoginInfo').style.display = 'none';
    document.getElementById('btnCancelPassword').style.display = 'block';
    document.getElementById('oldPassword').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('confirmPassword').value = '';
    document.getElementById('passwordError').style.display = 'none';
    document.getElementById('passwordSuccess').style.display = 'none';

    document.getElementById('jadwalCard').style.display = 'none';
    document.getElementById('passwordCard').style.display = 'block';
  }

  function handleCancelPassword() {
    document.getElementById('passwordCard').style.display = 'none';
    document.getElementById('jadwalCard').style.display = 'block';
  }

  // ---------- LOGOUT ----------
  function handleLogout() {
    if (!confirm('Yakin mau logout?')) return;
    localStorage.removeItem('fotografer');
    currentFotografer = null;
    isFirstLoginMode = false;
    location.reload();
  }

  // ---------- SIMPAN JADWAL VENDOR LAIN ----------
  function simpanJadwal() {
    var tanggal = document.getElementById('inputTanggal').value;
    var jamMulai = document.getElementById('inputJamMulai').value;
    var jamSelesai = document.getElementById('inputJamSelesai').value;
    var errorBox = document.getElementById('formError');
    var successBox = document.getElementById('formSuccess');

    errorBox.style.display = 'none';
    successBox.style.display = 'none';

    if (!tanggal || !jamMulai || !jamSelesai) {
      errorBox.innerText = '⚠️ Semua field wajib diisi.';
      errorBox.style.display = 'block';
      return;
    }
    if (jamMulai >= jamSelesai) {
      errorBox.innerText = '⚠️ Jam selesai harus lebih besar dari jam mulai.';
      errorBox.style.display = 'block';
      return;
    }
    if (!supabaseReady || !currentFotografer) {
      errorBox.innerText = '❌ Sistem belum siap. Refresh halaman.';
      errorBox.style.display = 'block';
      return;
    }

    var btn = document.getElementById('btnSimpan');
    btn.disabled = true;
    btn.classList.add('btn-loading');

    supabase.rpc('fotografer_simpan_jadwal', {
      p_fotografer_id: currentFotografer.fotografer_id,
      p_kota: currentFotografer.kota,
      p_tanggal: tanggal,
      p_jam_mulai: jamMulai,
      p_jam_selesai: jamSelesai,
      p_sumber: 'vendor_lain'
    })
      .then(function (res) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');

        if (res.error) {
          errorBox.innerText = '❌ ' + res.error.message;
          errorBox.style.display = 'block';
          return;
        }

        var d = res.data;
        if (d && d.error) {
          errorBox.innerText = '❌ ' + d.error;
          errorBox.style.display = 'block';
          return;
        }

        successBox.innerText = '✅ Jadwal berhasil disimpan!';
        successBox.style.display = 'block';

        document.getElementById('inputTanggal').value = new Date().toISOString().split('T')[0];
        document.getElementById('inputJamMulai').value = '';
        document.getElementById('inputJamSelesai').value = '';

        loadJadwal();
        showToast('✅ Jadwal vendor lain berhasil disimpan!');
      })
      .catch(function (err) {
        btn.disabled = false;
        btn.classList.remove('btn-loading');
        errorBox.innerText = '❌ Gagal menyimpan. Cek koneksi.';
        errorBox.style.display = 'block';
        console.error(err);
      });
  }

  // ---------- TAB SWITCH ----------
  function gantiTabJadwal(tab) {
    document.getElementById('tabLavelleBtn').classList.toggle('active', tab === 'lavelle');
    document.getElementById('tabVendorBtn').classList.toggle('active', tab === 'vendor');
    document.getElementById('tableJadwalLavelle').style.display = tab === 'lavelle' ? 'block' : 'none';
    document.getElementById('tableJadwal').style.display = tab === 'vendor' ? 'block' : 'none';
  }

  // ---------- WA HELPERS ----------
  function formatWaNumber(nomor) {
    var n = String(nomor || '').replace(/[^0-9]/g, '');
    if (n.startsWith('0')) n = '62' + n.slice(1);
    else if (n && !n.startsWith('62')) n = '62' + n;
    return n;
  }

  function buatLinkWaClient(row) {
    var nomor = formatWaNumber(row.wa);
    if (!nomor) return '';
    var jam = (row.jam_mulai || '').replace(':', '.') + ' - ' + (row.jam_selesai || '').replace(':', '.');
    var pesan = 'Halo saya fotografer Lavelle, ingin konfirmasi untuk jadwal foto berikut:\n' +
      'Nama: ' + (row.nama_client || '-') + '\n' +
      'Tanggal: ' + (row.tanggal || '-') + '\n' +
      'Jam: ' + jam + '\n' +
      'Lokasi: ' + (row.lokasi || '-');
    return 'https://api.whatsapp.com/send/?phone=' + nomor +
      '&text=' + encodeURIComponent(pesan) +
      '&type=phone_number&app_absent=0';
  }

  // ---------- GOOGLE CALENDAR LINK ----------
  function buatLinkKalender(row, sumber) {
    var judul;
    if (sumber === 'lavelle') {
      judul = 'Job Lavelle - ' + (row.nama_client || 'Client');
    } else {
      judul = 'Job Vendor Lain - Lavelle';
    }

    var tanggalClean = String(row.tanggal || '').replace(/-/g, '');
    var jamMulaiClean = String(row.jam_mulai || '00:00').substring(0, 5).replace(':', '') + '00';
    var jamSelesaiClean = String(row.jam_selesai || '00:00').substring(0, 5).replace(':', '') + '00';

    var startDT = tanggalClean + 'T' + jamMulaiClean;
    var endDT = tanggalClean + 'T' + jamSelesaiClean;

    var details;
    if (sumber === 'lavelle') {
      details = 'Nama Client: ' + (row.nama_client || '-') + '\n' +
                'Lokasi: ' + (row.lokasi || '-') + '\n' +
                'No. WA: ' + (row.wa || '-');
    } else {
      details = 'Job dari vendor lain';
    }

    var location = sumber === 'lavelle' ? (row.lokasi || '') : '';

    var params = new URLSearchParams({
      action: 'TEMPLATE',
      text: judul,
      dates: startDT + '/' + endDT,
      details: details,
      location: location
    });

    return 'https://calendar.google.com/calendar/render?' + params.toString();
  }

  // ---------- COPY ----------
  function copyJadwalLavelle(i) {
    var row = lastJadwalLavelle[i];
    if (!row) return;
    var jam = (row.jam_mulai || '').replace(':', '.') + ' - ' + (row.jam_selesai || '').replace(':', '.');
    var teks = 'Tanggal: ' + (row.tanggal || '-') + '\n' +
      'Jam: ' + jam + '\n' +
      'Nama Client: ' + (row.nama_client || '-') + '\n' +
      'Lokasi: ' + (row.lokasi || '-') + '\n' +
      'No. WA: ' + (row.wa || '-');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(teks)
        .then(function () { showToast('✅ Jadwal disalin ke clipboard'); })
        .catch(function () { showToast('❌ Gagal menyalin jadwal'); });
    } else {
      showToast('⚠️ Browser tidak mendukung clipboard');
    }
  }

  function copySemuaJadwalLavelle() {
    if (!lastJadwalLavelle || lastJadwalLavelle.length === 0) {
      showToast('📭 Belum ada jadwal untuk disalin');
      return;
    }
    var teks = lastJadwalLavelle.map(function (row, i) {
      var jam = (row.jam_mulai || '').replace(':', '.') + ' - ' + (row.jam_selesai || '').replace(':', '.');
      return (i + 1) + '. Tanggal: ' + (row.tanggal || '-') + '\n' +
        'Jam: ' + jam + '\n' +
        'Nama Client: ' + (row.nama_client || '-') + '\n' +
        'Lokasi: ' + (row.lokasi || '-') + '\n' +
        'No. WA: ' + (row.wa || '-');
    }).join('\n\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(teks)
        .then(function () { showToast('✅ ' + lastJadwalLavelle.length + ' jadwal disalin'); })
        .catch(function () { showToast('❌ Gagal menyalin jadwal'); });
    } else {
      showToast('⚠️ Browser tidak mendukung clipboard');
    }
  }

  // ---------- RENDER TABEL ----------
  function renderTabelLavelle(data) {
    var container = document.getElementById('tableJadwalLavelle');

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="no-data">📭 Belum ada jadwal Lavelle</div>';
      lastJadwalLavelle = [];
      return;
    }

    lastJadwalLavelle = data;

    var html = '<table><thead><tr>' +
      '<th>Tanggal</th><th>Jam</th><th>Nama Client</th><th>Lokasi</th>' +
      '<th>Gdrive</th><th>No. WA</th><th>Kalender</th><th>Copy</th>' +
      '</tr></thead><tbody>';

    data.forEach(function (row, i) {
      var jam = (row.jam_mulai || '').replace(':', '.') + ' - ' + (row.jam_selesai || '').replace(':', '.');
      var linkWa = buatLinkWaClient(row);
      var waCell = linkWa ? '<a class="wa-link" href="' + linkWa + '" target="_blank">💬 Chat</a>' : '-';
      var gdriveCell = row.link_gdrive ? '<a href="' + row.link_gdrive + '" target="_blank">📁 Buka</a>' : '-';

      var linkKalender = buatLinkKalender(row, 'lavelle');
      var kalenderCell = '<a class="calendar-btn" href="' + linkKalender + '" target="_blank">📅 Tambah</a>';

      html += '<tr>' +
        '<td>' + (row.tanggal || '-') + '</td>' +
        '<td>' + jam + '</td>' +
        '<td>' + (row.nama_client || '-') + '</td>' +
        '<td>' + (row.lokasi || '-') + '</td>' +
        '<td>' + gdriveCell + '</td>' +
        '<td>' + waCell + '</td>' +
        '<td>' + kalenderCell + '</td>' +
        '<td><button class="copy-btn" onclick="copyJadwalLavelle(' + i + ')">📋 Copy</button></td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  function renderTabelVendor(data) {
    var container = document.getElementById('tableJadwal');

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="no-data">📭 Belum ada jadwal vendor lain</div>';
      return;
    }

    var html = '<table><thead><tr>' +
      '<th>Tanggal</th><th>Jam</th><th>Sumber</th><th>Kalender</th>' +
      '</tr></thead><tbody>';

    data.forEach(function (row) {
      var linkKalender = buatLinkKalender(row, 'vendor');
      var kalenderCell = '<a class="calendar-btn" href="' + linkKalender + '" target="_blank">📅 Tambah</a>';

      html += '<tr>' +
        '<td>' + (row.tanggal || '-') + '</td>' +
        '<td>' + (row.jam_mulai || '') + ' - ' + (row.jam_selesai || '') + '</td>' +
        '<td><span class="badge-vendor">Vendor Lain</span></td>' +
        '<td>' + kalenderCell + '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  // ---------- LOAD JADWAL ----------
  function loadJadwal() {
    var containerLavelle = document.getElementById('tableJadwalLavelle');
    var containerVendor = document.getElementById('tableJadwal');
    containerLavelle.innerHTML = '<div class="no-data">⏳ Memuat...</div>';
    containerVendor.innerHTML = '<div class="no-data">⏳ Memuat...</div>';

    if (!currentFotografer) return;

    if (!supabaseReady) {
      var pesan = '<div class="no-data">❌ Sistem belum siap. Refresh halaman.</div>';
      containerLavelle.innerHTML = pesan;
      containerVendor.innerHTML = pesan;
      return;
    }

    supabase.rpc('fotografer_get_jadwal', { p_fotografer_id: currentFotografer.fotografer_id })
      .then(function (res) {
        if (res.error) {
          var p = '<div class="no-data">❌ ' + res.error.message + '</div>';
          containerLavelle.innerHTML = p;
          containerVendor.innerHTML = p;
          return;
        }

        var d = res.data || {};
        if (d.error) {
          var p2 = '<div class="no-data">❌ ' + d.error + '</div>';
          containerLavelle.innerHTML = p2;
          containerVendor.innerHTML = p2;
          return;
        }

        renderTabelLavelle(d.lavelle || []);
        renderTabelVendor(d.vendor || []);
      })
      .catch(function (err) {
        var p = '<div class="no-data">❌ Gagal memuat jadwal</div>';
        containerLavelle.innerHTML = p;
        containerVendor.innerHTML = p;
        console.error(err);
      });
  }

  // ---------- EXPOSE KE WINDOW ----------
  window.handleLogin = handleLogin;
  window.handleLogout = handleLogout;
  window.handleSavePassword = handleSavePassword;
  window.openPasswordSettings = openPasswordSettings;
  window.handleCancelPassword = handleCancelPassword;
  window.simpanJadwal = simpanJadwal;
  window.loadJadwal = loadJadwal;
  window.gantiTabJadwal = gantiTabJadwal;
  window.copyJadwalLavelle = copyJadwalLavelle;
  window.copySemuaJadwalLavelle = copySemuaJadwalLavelle;

  // ---------- ENTER KEY ----------
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var lc = document.getElementById('loginCard');
      var pc = document.getElementById('passwordCard');
      if (lc && lc.style.display !== 'none') {
        handleLogin();
      } else if (pc && pc.style.display !== 'none') {
        handleSavePassword();
      }
    }
  });

  // ---------- PIN ONLY NUMBERS ----------
  var pinEl = document.getElementById('loginPin');
  if (pinEl) {
    pinEl.addEventListener('input', function () {
      this.value = this.value.replace(/\D/g, '');
    });
  }

  // ---------- RESTORE SESSION ----------
  (function restoreSession() {
    if (!supabaseReady) return;
    var saved = localStorage.getItem('fotografer');
    if (!saved) return;
    try {
      var data = JSON.parse(saved);
      if (!data || !data.fotografer_id) {
        localStorage.removeItem('fotografer');
        return;
      }

      supabase
        .from('fotografer')
        .select('*')
        .eq('fotografer_id', data.fotografer_id)
        .maybeSingle()
        .then(function (res) {
          if (!res.data) {
            localStorage.removeItem('fotografer');
            return;
          }
          currentFotografer = res.data;

          if (res.data.must_change_password === true) {
            isFirstLoginMode = true;
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('passwordCard').style.display = 'block';
            document.getElementById('passwordTitle').textContent = 'Selamat Datang!';
            document.getElementById('passwordSubtitle').textContent =
              'Halo ' + res.data.nama + ', buat password baru kamu.';
            document.getElementById('firstLoginInfo').style.display = 'block';
            document.getElementById('btnCancelPassword').style.display = 'none';
            document.getElementById('oldPassword').value = res.data.pin || '';
          } else {
            showJadwalPanel(res.data);
          }
        })
        .catch(function (err) {
          console.error('Restore session error:', err);
        });
    } catch (e) {
      localStorage.removeItem('fotografer');
    }
  })();

  console.log('✅ Fotografer panel siap.');
})();
</script>
