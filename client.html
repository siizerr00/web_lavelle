<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Status | Studio Lavelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2E2532;
    --paper:#FBF6F2;
    --rose:#B76E79;
    --gold:#C9A66B;
    --sage:#6B8F71;
    --mute:#8C8389;
    --line:#E4D9D3;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Fraunces',serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .container{max-width:800px;margin:0 auto;padding:24px;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:24px;
    box-shadow:0 4px 24px rgba(46,37,50,.08);
    margin-bottom:20px;
  }
  .logo{
    text-align:center;padding:12px 0 8px;
  }
  .logo h1{font-size:28px;font-style:italic;font-weight:500;}
  .logo p{color:var(--mute);font-size:14px;margin-top:4px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  .field input{
    width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:8px;
    font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--ink);
  }
  .field input:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px rgba(183,110,121,.15);}
  
  .btn-primary{
    width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:8px;
    font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;
    transition:background .2s;
  }
  .btn-primary:hover{background:var(--rose);}
  .btn-primary:disabled{opacity:0.6;cursor:not-allowed;}
  
  .btn-secondary{
    padding:10px 20px;background:none;color:var(--mute);border:1px solid var(--line);border-radius:8px;
    font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;
  }
  .btn-secondary:hover{color:var(--ink);border-color:var(--ink);}

  .btn-save-foto{
    width:100%;padding:12px;background:var(--sage);color:#fff;border:none;border-radius:8px;
    font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;
    transition:background .2s;margin-top:12px;
  }
  .btn-save-foto:hover{background:#597A5F;}
  .btn-save-foto:disabled{opacity:0.6;cursor:not-allowed;}

  .error-box{display:none;color:#B3413E;font-size:13px;padding:10px 14px;background:#FDE8E8;border-radius:8px;margin-top:8px;}
  .success-box{display:none;color:#065F46;font-size:13px;padding:10px 14px;background:#D1FAE5;border-radius:8px;margin-top:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:100;animation:slideUp .3s;
  }
  @keyframes slideUp{from{transform:translate(-50%,20px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
  @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  .btn-loading{position:relative;pointer-events:none;opacity:0.7;}
  .btn-loading::after{
    content:"";position:absolute;right:16px;top:50%;transform:translateY(-50%);
    width:18px;height:18px;border:2px solid #fff;border-top:2px solid transparent;border-radius:50%;animation:spin 0.8s linear infinite;
  }
  .loading-spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--line);border-top:2px solid var(--rose);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;}

  .status-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px;}
  .status-header .booking-id{font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--mute);}
  .status-icon{font-size:48px;text-align:center;margin:8px 0;}
  .status-label{font-size:22px;font-weight:600;text-align:center;color:var(--rose);}
  .status-desc{text-align:center;color:var(--mute);font-size:14px;margin-top:4px;}
  
  .progress-bar{background:var(--line);border-radius:8px;height:8px;overflow:hidden;margin:16px 0;}
  .progress-bar .fill{background:var(--rose);height:100%;border-radius:8px;transition:width .5s;}
  .progress-steps{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin-top:4px;}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .info-grid .item{background:var(--paper);border-radius:8px;padding:12px;border:1px solid var(--line);}
  .info-grid .item .label{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;}
  .info-grid .item .value{font-size:14px;font-weight:500;margin-top:4px;}
  .info-grid .item .value a{color:var(--rose);text-decoration:none;word-break:break-all;}
  .info-grid .item .value a:hover{text-decoration:underline;}
  .info-grid .item.full{grid-column:1/3;}

  .countdown{text-align:center;padding:12px;background:var(--paper);border-radius:8px;border:1px solid var(--gold);margin-top:12px;font-weight:500;}

  .foto-list{margin-top:16px;}
  .foto-list .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .foto-list .header h3{font-size:16px;font-weight:500;}
  .foto-list .header .counter{font-size:12px;color:var(--mute);}
  .foto-item{
    display:flex;align-items:center;gap:12px;padding:10px 14px;
    border:1px solid var(--line);border-radius:8px;margin-bottom:8px;
    background:var(--card);transition:all .2s;
  }
  .foto-item:hover{background:var(--paper);}
  .foto-item .number{font-size:12px;color:var(--mute);min-width:30px;font-weight:600;}
  .foto-item input{
    flex:1;border:none;background:transparent;padding:6px 0;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);
    transition:border .2s;
  }
  .foto-item input:focus{outline:none;border-bottom:2px solid var(--rose);}
  .foto-item input::placeholder{color:#C9BFC3;}
  .foto-item .status-badge{font-size:10px;padding:2px 10px;border-radius:12px;font-weight:600;white-space:nowrap;}
  .foto-item .status-badge.done{background:#D1FAE5;color:#065F46;}
  .foto-item .status-badge.pending{background:#FEF3C7;color:#92400E;}

  .gdrive-box{
    background:var(--paper);border-radius:8px;padding:16px;border:1px solid var(--sage);margin-top:12px;
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .gdrive-box .icon{font-size:24px;}
  .gdrive-box .link{flex:1;word-break:break-all;}
  .gdrive-box .link a{color:var(--rose);text-decoration:none;}
  .gdrive-box .link a:hover{text-decoration:underline;}

  .empty-state{text-align:center;padding:20px;color:var(--mute);}

  .foto-item.saved{background:#F0FAF0;border-color:var(--sage);}
  .foto-item .save-indicator{font-size:12px;color:var(--sage);display:none;}
  .foto-item.saved .save-indicator{display:inline;}

  .keyboard-hint{
    font-size:11px;color:var(--mute);text-align:center;margin-top:8px;
    padding:6px 12px;background:var(--paper);border-radius:6px;border:1px dashed var(--line);
  }
  .keyboard-hint kbd{
    background:var(--card);padding:2px 8px;border-radius:4px;
    border:1px solid var(--line);font-family:'IBM Plex Mono',monospace;font-size:10px;
  }

  @media (max-width:640px){
    .card{padding:16px;}
    .info-grid{grid-template-columns:1fr;}
    .info-grid .item.full{grid-column:1;}
    .foto-item{flex-wrap:wrap;gap:6px;}
    .foto-item input{min-width:100px;}
    .status-header{flex-direction:column;align-items:flex-start;}
  }

  .login-card{max-width:450px;margin:40px auto;}
  .login-card .logo{margin-bottom:20px;}
</style>
</head>
<body>

<div class="container" id="app">

  <div class="card login-card" id="loginCard">
    <div class="logo">
      <h1>Studio Lavelle</h1>
      <p>Cek Status Booking</p>
    </div>

    <div class="field">
      <label>📧 Email</label>
      <input type="email" id="inputEmail" placeholder="Email kamu">
    </div>
    <div class="field">
      <label>🆔 Booking ID</label>
      <input type="text" id="inputBookingId" placeholder="Contoh: SBY20260825-01-D">
    </div>

    <button class="btn-primary" id="btnCek" onclick="cekStatusManual()">🔍 Cek Status</button>
    <div style="text-align:center;margin-top:12px;">
      <span class="text-muted" style="font-size:12px;">Atau gunakan magic link dari admin</span>
    </div>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div id="statusCard" style="display:none;">

    <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <div class="logo" style="padding:0;">
        <h1 style="font-size:22px;">Studio Lavelle</h1>
        <p style="font-size:12px;">🎓 Client Panel</p>
      </div>
      <button class="btn-secondary" onclick="kembaliKeLogin()" style="padding:6px 16px;">← Kembali</button>
    </div>

    <div class="card" id="statusContent">
      <div class="text-center" style="padding:40px;"><span class="loading-spinner"></span> Memuat status...</div>
    </div>

  </div>

</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var supabase = window.supabase.createClient(
    window.LAVELLE_CONFIG.SUPABASE_URL,
    window.LAVELLE_CONFIG.SUPABASE_KEY
  );
  var token = new URLSearchParams(window.location.search).get('token');

  if(!token){ document.body.innerHTML = '<p style="text-align:center;padding:40px;">Token tidak ditemukan.</p>'; return; }

  supabase.rpc('get_client_status_by_token',{ p_token: token })
    .then(function(res){
      if(res.error){ console.error(res.error); return; }
      var d = res.data;
      if(d.error){ document.body.innerHTML = '<p style="text-align:center;padding:40px;">'+d.error+'</p>'; return; }
      renderClientStatus(d);
    });

  function renderClientStatus(d){
    // ... render pakai field yang sama seperti sebelumnya ...
  }

  window.saveFotoList = function(list){
    supabase.rpc('client_save_foto_list',{ p_token: token, p_foto_list: list })
      .then(function(){ alert('Daftar foto tersimpan'); });
  };
})();
</script>
</body>
</html>
