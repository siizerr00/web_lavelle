<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Lavelle | Pilih Wilayah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E2532;
  --paper:#FBF6F2;
  --rose:#B76E79;
  --gold:#C9A66B;
  --mute:#8C8389;
  --line:#E4D9D3;
  --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
header{
  padding:64px 24px 40px;
  text-align:center;
  border-bottom:1px dashed var(--line);
}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;
  letter-spacing:.14em;
  text-transform:uppercase;
  font-size:12px;
  color:var(--rose);
  margin-bottom:14px;
}
h1{
  font-family:'Fraunces',serif;
  font-size:clamp(32px,5vw,52px);
  font-weight:500;
  font-style:italic;
  line-height:1.1;
  margin:0;
}
header p{margin:12px 0 0;color:var(--mute);font-size:15px}
.region-wrap{max-width:920px;margin:0 auto;padding:40px 24px 60px}
.region-label{
  font-size:13px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--mute);
  margin-bottom:16px;
}
.region-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.region-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:6px;
  padding:22px 24px 20px;
  text-align:left;
  min-height:172px;
}
.region-card .kode{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;
  color:var(--gold);
  letter-spacing:.06em;
}
.region-card h2{
  font-family:'Fraunces',serif;
  font-size:32px;
  margin:10px 0 14px;
  font-weight:500;
}
.region-card .tarik{font-size:15px;color:var(--mute)}
@media(max-width:700px){
  .region-grid{grid-template-columns:1fr;max-width:420px;margin:0 auto}
}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Foto Wisuda · Booking Sesi</div>
  <h1>Studio Lavelle</h1>
  <p>Female Photographer</p>
</header>

<main class="region-wrap">
  <div class="region-label">Booking untuk wilayah</div>
  <div class="region-grid">
    <div class="region-card">
      <div class="kode">JGY</div>
      <h2>Jogja</h2>
      <div class="tarik">📅 Lihat jadwal</div>
    </div>
    <div class="region-card">
      <div class="kode">SLO</div>
      <h2>Solo</h2>
      <div class="tarik">📅 Lihat jadwal</div>
    </div>
    <div class="region-card">
      <div class="kode">SBY</div>
      <h2>Surabaya</h2>
      <div class="tarik">📅 Lihat jadwal</div>
    </div>
  </div>
</main>
</body>
</html>
